; MunnaVPS TigerVNC fallback supervisor config (template).
; The entrypoint substitutes @DESKTOP_USER@ and @HOME_DIR@ before starting
; supervisord as root; each program runs as the desktop user.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/munnavps-supervisord.pid
childlogdir=/tmp

[program:xvnc]
priority=10
command=/usr/local/bin/munnavps-start-xvnc
user=@DESKTOP_USER@
environment=HOME="@HOME_DIR@",USER="@DESKTOP_USER@",LOGNAME="@DESKTOP_USER@"
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
priority=20
command=/usr/bin/websockify --web=/usr/share/novnc 0.0.0.0:6080 127.0.0.1:5901
user=@DESKTOP_USER@
environment=HOME="@HOME_DIR@",USER="@DESKTOP_USER@",LOGNAME="@DESKTOP_USER@"
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
